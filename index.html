<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15100b">
<title>LIEF · Primer semestre</title>
<link rel="icon" type="image/png" href="mampara1916/img/iconos/icono-192.png">
<style>
@view-transition{navigation:auto}
@font-face{font-family:'Rye';src:url(mampara1916/fuentes/rye.woff2) format('woff2');font-display:swap}
@font-face{font-family:'IM Fell English';font-style:italic;src:url(mampara1916/fuentes/fell-italica.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Lora';font-weight:400;src:url(mampara1916/fuentes/lora-400.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Lora';font-weight:700;src:url(mampara1916/fuentes/lora-700.woff2) format('woff2');font-display:swap}
:root{--muro:#15100b;--hueso:#f6efdc;--tinta:#6b4a1f;--sepia:#2b2015}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  background:radial-gradient(110% 80% at 50% 0%,#33251a 0%,var(--muro) 65%) var(--muro);color:var(--hueso);font-family:'Lora',Georgia,serif}
main{width:min(100%,30rem)}
.logos{display:flex;align-items:center;gap:18px;padding:10px 14px;margin-bottom:22px;width:max-content;max-width:100%;background:var(--hueso);border-radius:10px}
.logos img{height:34px;width:auto;display:block}
h1{margin:0;font:400 clamp(2rem,9vw,2.9rem)/1.02 'Rye',Georgia,serif;color:#e9d3a3}
.sub{margin:.5rem 0 1.8rem;font:italic 400 1.1rem/1.3 'IM Fell English',Georgia,serif;color:#d8c7a3}
.trabajo{position:relative;display:grid;grid-template-columns:auto 1fr;gap:14px 16px;align-items:center;padding:16px;border-radius:14px;text-decoration:none;color:var(--sepia);overflow:hidden;
  background:#eedcb0 url(mampara1916/img/papel-hoja-0.jpg) center/cover;box-shadow:0 2px 3px rgba(0,0,0,.4),0 18px 40px rgba(0,0,0,.5);
  transform:translateY(var(--ty,0px));transition:transform .45s cubic-bezier(.22,1,.3,1),box-shadow .45s}
.trabajo::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;opacity:0;transition:opacity .4s;
  background:radial-gradient(60% 70% at var(--bx,30%) var(--by,20%),rgba(255,251,240,.3),rgba(255,251,240,0) 70%)}
.trabajo:active{transform:scale(.98)}
@media (hover:hover){.trabajo:hover{--ty:-3px;box-shadow:0 3px 4px rgba(0,0,0,.4),0 26px 50px rgba(0,0,0,.55)}.trabajo:hover::after{opacity:1}}
.trabajo:focus-visible{outline:3px solid #d6b06a;outline-offset:4px}
.trabajo img{width:72px;height:72px;border-radius:16px;display:block;box-shadow:0 1px 3px rgba(0,0,0,.4);view-transition-name:libro}
.trabajo small{display:block;font:700 .68rem/1 'Lora',Georgia,serif;letter-spacing:.18em;text-transform:uppercase;color:var(--tinta)}
.trabajo b{display:block;margin:.3rem 0 .2rem;font:400 1.5rem/1.05 'Rye',Georgia,serif;color:var(--tinta)}
.trabajo span{display:block;font-size:.92rem;line-height:1.35}
.trabajo i{grid-column:1 / -1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;border-radius:999px;background:var(--tinta);color:var(--hueso);font:700 .88rem/1 'Lora',Georgia,serif;font-style:normal;letter-spacing:.06em}
footer{margin-top:1.8rem;font-size:.8rem;line-height:1.5;color:#b9a888}
/* entrada: cada pieza llega a su lugar, una tras otra */
main > *{animation:llega .8s cubic-bezier(.22,1,.3,1) both}
main > :nth-child(2){animation-delay:.08s}main > :nth-child(3){animation-delay:.16s}main > :nth-child(4){animation-delay:.26s}main > :nth-child(5){animation-delay:.36s}
@keyframes llega{from{opacity:0;transform:translateY(14px);filter:blur(4px)}}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(60% 45% at 50% 8%,rgba(255,214,150,.09),rgba(255,214,150,0) 70%)}
/* al entrar al libro, el ícono crece hasta volverse su portada (navegadores que lo permiten) */
::view-transition-group(libro){animation-duration:.75s;animation-timing-function:cubic-bezier(.3,.7,.2,1)}
@media (prefers-reduced-motion:reduce){main > *{animation:none}.trabajo{transition:none}::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}
</style>
</head>
<body>
<main>
  <div class="logos"><img src="mampara1916/img/logo-uaeh.webp" alt="Universidad Autónoma del Estado de Hidalgo" width="75" height="34"><img src="mampara1916/img/logo-apan.webp" alt="Escuela Superior de Apan" width="83" height="34"></div>
  <h1>LIEF · Primer semestre</h1>
  <p class="sub">Licenciatura en Ingeniería Económica y Financiera</p>
  <a class="trabajo" href="mampara1916/">
    <img src="mampara1916/img/iconos/icono-192.png" alt="">
    <div><small>Principios de Economía</small><b>Mampara 1916</b><span>México, 1916–1940: el PIB y la deuda externa en una línea de tiempo con 28 hojas que se despliegan.</span></div>
    <i>Abrir el libro →</i>
  </a>
  <footer>Escuela Superior de Apan · Universidad Autónoma del Estado de Hidalgo</footer>
</main>
<script>
/* con ratón, la luz sigue al puntero sobre la tarjeta */
if (matchMedia('(hover: hover) and (pointer: fine)').matches && !matchMedia('(prefers-reduced-motion: reduce)').matches){
  const t = document.querySelector('.trabajo');
  t.addEventListener('pointermove', e => {
    const r = t.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    t.style.setProperty('--bx', (x * 100).toFixed(1) + '%'); t.style.setProperty('--by', (y * 100).toFixed(1) + '%');
  });
}
</script>
</body>
</html>
